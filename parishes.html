<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chain Bank - Parishes</title><script src="https://cdn.tailwindcss.com"></script><script src="lang.js"></script><style>body{background:radial-gradient(circle at 10%20%,#1A1510,#0D0A07);color:#F5E6D3;}.glass{background:rgba(44,36,24,0.75);backdrop-filter:blur(12px);border-radius:24px;padding:1.5rem;margin-bottom:1.5rem;}.btn-primary{background:linear-gradient(90deg,#8B6914,#C5A059,#FFDF85);color:#1A1510;padding:0.5rem 1.2rem;border-radius:40px;display:inline-block;}.btn-secondary{background:rgba(197,160,89,0.15);border:1px solid rgba(197,160,89,0.4);padding:0.5rem 1.2rem;border-radius:40px;display:inline-block;}</style></head>
<body class="p-4"><div class="max-w-3xl mx-auto"><div class="flex justify-between items-center mb-6 pb-3 border-b border-gold/30"><h1 class="text-3xl font-bold" style="font-family:'Cormorant Garamond',serif; color:#FFDF85;">⛪ Support your Parish</h1><a href="index.html" class="btn-secondary">← Back</a></div>
<div class="glass"><h2 class="text-xl font-bold mb-3">Parish leader? Get your referral code</h2><button id="getCodeBtn" class="btn-primary w-full py-2 rounded-full">Get parish code</button><div id="codeDisplay" class="mt-3 hidden"><p class="text-sm">Your referral link:</p><input type="text" id="refCode" readonly class="w-full p-2 rounded bg-black/50 border"></div></div>
<div class="glass"><h2 class="text-xl font-bold mb-3">Support your parish</h2><p>Use a parish referral code when you donate. 5% of your donation will go to that parish.</p><input type="text" id="parishCode" placeholder="Enter parish code" class="w-full p-2 rounded bg-black/50 border mb-2"><button id="supportBtn" class="btn-primary w-full py-2 rounded-full">Donate with support</button></div></div>
<script>document.getElementById('getCodeBtn').onclick=()=>{let wallet=localStorage.getItem('userWallet')||'';if(!wallet){alert('Save your wallet on main page first');return;}let code=btoa(wallet).slice(0,16);document.getElementById('codeDisplay').classList.remove('hidden');document.getElementById('refCode').value=`${window.location.origin}?ref=${code}`;};document.getElementById('supportBtn').onclick=()=>{let code=document.getElementById('parishCode').value;if(code){alert(`Thank you! Your donation will support parish ${code}. After sending tokens, verify TXID on main page.`);}else alert('Enter parish code');};</script></body></html>
