<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chain Bank - Saints Gallery</title><script src="https://cdn.tailwindcss.com"></script><script src="lang.js"></script><style>body{background:radial-gradient(circle at 10%20%,#1A1510,#0D0A07);color:#F5E6D3;}.glass{background:rgba(44,36,24,0.75);backdrop-filter:blur(12px);border-radius:24px;padding:1.5rem;margin-bottom:1.5rem;}.btn-primary{background:linear-gradient(90deg,#8B6914,#C5A059,#FFDF85);color:#1A1510;padding:0.5rem 1.2rem;border-radius:40px;display:inline-block;}.btn-secondary{background:rgba(197,160,89,0.15);border:1px solid rgba(197,160,89,0.4);padding:0.5rem 1.2rem;border-radius:40px;display:inline-block;}.saint-card{transition:0.2s;}.saint-card:hover{transform:translateY(-5px);}</style></head>
<body class="p-4"><div class="max-w-5xl mx-auto"><div class="flex justify-between items-center mb-6 pb-3 border-b border-gold/30"><h1 class="text-3xl font-bold" style="font-family:'Cormorant Garamond',serif; color:#FFDF85;">👼 Saints Gallery</h1><a href="index.html" class="btn-secondary">← Back</a></div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="saintsList"></div></div>
<script>const saints=[{name:"St. Nicholas",feast:"December 6",icon:"🎅",mint:"USVT"},{name:"St. George",feast:"April 23",icon:"🐉",mint:"USVT"},{name:"St. Seraphim",feast:"January 2",icon:"🕯️",mint:"USVT"},{name:"St. Panteleimon",feast:"July 27",icon:"⚕️",mint:"USVT"},{name:"St. Vladimir",feast:"July 15",icon:"⛪",mint:"USVT"},{name:"St. Olga",feast:"July 11",icon:"👑",mint:"USVT"}];let collected=JSON.parse(localStorage.getItem('collectedSaints')||'[]');function render(){let container=document.getElementById('saintsList');container.innerHTML=saints.map(s=>{let owned=collected.includes(s.name);return `<div class="glass p-4 text-center saint-card"><div class="text-5xl mb-2">${s.icon}</div><div class="font-bold text-xl">${s.name}</div><div class="text-sm opacity-70">Feast: ${s.feast}</div><div class="mt-2">${owned?'✅ Collected':'❌ Not collected'}</div>${!owned?`<button class="collectBtn mt-3 btn-primary px-3 py-1 text-sm rounded-full" data-name="${s.name}" data-mint="${s.mint}">Get NFT Icon (send 1 ${s.mint} to BOG)</button>`:''}</div>`}).join('');
document.querySelectorAll('.collectBtn').forEach(btn=>btn.onclick=()=>{let name=btn.dataset.name;alert(`Send 1 USVT to BOG address, then verify TXID on main page. After verification, this saint will be added to your collection.`);});}
render();</script></body></html>
