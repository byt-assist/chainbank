<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>25 духовных дел · Chain Bank</title><script src="https://cdn.tailwindcss.com"></script><script src="lang.js"></script><style>body{background:radial-gradient(circle at 10%20%,#1A1510,#0D0A07);color:#F5E6D3;}.glass{background:rgba(44,36,24,0.75);backdrop-filter:blur(12px);border-radius:24px;padding:1.5rem;margin-bottom:1.5rem;}.btn-primary{background:linear-gradient(90deg,#8B6914,#C5A059,#FFDF85);color:#1A1510;padding:0.5rem 1.2rem;border-radius:40px;display:inline-block;cursor:pointer;}.btn-secondary{background:rgba(197,160,89,0.15);border:1px solid rgba(197,160,89,0.4);padding:0.5rem 1.2rem;border-radius:40px;display:inline-block;cursor:pointer;}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:1000;}.modal-content{background:#0B132B;border-radius:2rem;padding:1.5rem;max-width:500px;width:90%;}</style></head>
<body class="p-4"><div class="max-w-6xl mx-auto"><div class="flex justify-between items-center mb-6"><h1 class="text-3xl font-bold">🙏 25 духовных дел</h1><a href="index.html" class="btn-secondary">← На главную</a></div><div class="glass text-center mb-6"><p class="italic">Каждое дело требует отправки токенов на указанный адрес. После отправки вставьте TXID для подтверждения.</p></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="actionsList"></div></div>
<div id="txModal" class="modal"><div class="modal-content"><h3 id="modalTitle" class="text-xl font-bold mb-3"></h3><p id="modalDesc" class="text-sm mb-3"></p><p class="text-sm mb-2">Отправьте токены на адрес: <strong id="modalAddress" class="break-all"></strong></p><input type="text" id="txidInput" class="w-full p-2 rounded bg-black/50 border border-gold/30 mb-3" placeholder="Вставьте TXID"><button id="confirmBtn" class="btn-primary w-full py-2 rounded-full">Подтвердить</button><div id="txStatus" class="text-sm mt-2 text-center"></div><button id="closeModal" class="btn-secondary w-full mt-3 py-2 rounded-full">Закрыть</button></div></div>
<script>const GOD_ADDRESS="DpgFgCXatvnegBAHBkNpd2cbEiyFL8E9sY1o6mp4EGhe",DEMON_ADDRESS="NbKJV6mn8NxnbXVPmBX6vxcdriVf7Pozjkwb9QJKETu",ZERO_ADDRESS="11111111111111111111111111111111";const actions=[{id:1,name:"🕯️ Обычная свеча",desc:"Отправьте 1 USVT на адрес Бога",token:"USVT",address:GOD_ADDRESS,amount:1},{id:2,name:"✨ Вечная свеча",desc:"Отправьте 1 USVT + 1 DEMON на адрес Бога",token:"USVT+DEMON",address:GOD_ADDRESS,amount:2},{id:3,name:"🏛️ Соборная свеча",desc:"Ваше имя на главной странице 24 часа",token:"USVT",address:GOD_ADDRESS,amount:10},{id:4,name:"📿 Именная молитва",desc:"Молитва с вашим именем",token:"USVT",address:GOD_ADDRESS,amount:5},{id:5,name:"📆 Сорокоуст (40 дней)",desc:"Поминовение на 40 дней",token:"USVT",address:GOD_ADDRESS,amount:40},{id:6,name:"📅 Годовая свеча",desc:"Имя горит целый год",token:"USVT",address:GOD_ADDRESS,amount:365},{id:7,name:"⛪ Поминовение в храме",desc:"Передадим список в реальный храм",token:"USVT",address:GOD_ADDRESS,amount:100},{id:8,name:"📖 Молитвенное правило",desc:"Отметьте день молитвы",token:"USVT",address:GOD_ADDRESS,amount:1},{id:9,name:"🎨 Купить аватар святого",desc:"Уникальный аватар (NFT)",token:"USVT",address:GOD_ADDRESS,amount:50},{id:10,name:"🖼️ Разместить икону в галерее",desc:"Ваша икона появится на сайте",token:"USVT",address:GOD_ADDRESS,amount:100},{id:11,name:"🙏 Заказ молебна онлайн",desc:"Виртуальный молебен",token:"USVT",address:GOD_ADDRESS,amount:20},{id:12,name:"🤝 Пожертвование в фонд",desc:"Имя в списке благотворителей",token:"USVT",address:GOD_ADDRESS,amount:"любая"},{id:13,name:"🏅 Подписка «Друг монастыря»",desc:"Доступ к закрытым трансляциям",token:"USVT",address:GOD_ADDRESS,amount:50},{id:14,name:"🗳️ Создать голосование",desc:"Предложить идею в DAO",token:"BOG",address:DEMON_ADDRESS,amount:100},{id:15,name:"⚡ Усилить голос (veto)",desc:"Заблокировать чужое предложение",token:"BOG",address:DEMON_ADDRESS,amount:1000},{id:16,name:"👑 Купить роль «Старейшина»",desc:"Модерировать молитвы",token:"USVT",address:GOD_ADDRESS,amount:500},{id:17,name:"📢 Выкупить рекламу на сайте",desc:"Баннер с вашим именем",token:"USVT",address:GOD_ADDRESS,amount:200},{id:18,name:"🖼️ Купить NFT-икону",desc:"Уникальная икона в кошелёк",token:"USVT",address:GOD_ADDRESS,amount:50},{id:19,name:"🕊️ Купить фрагмент мощей (символ)",desc:"NFT + запись в книге паломников",token:"USVT",address:GOD_ADDRESS,amount:500},{id:20,name:"👥 Собрать коллекцию «12 апостолов»",desc:"Редкий аватар «Апостол»",token:"USVT",address:GOD_ADDRESS,amount:600},{id:21,name:"🎓 Сертификат паломника",desc:"После 100 км пути",token:"USVT",address:GOD_ADDRESS,amount:30},{id:22,name:"💀 Осквернить свечу",desc:"Потушить чужую свечу",token:"DEMON",address:GOD_ADDRESS,amount:1},{id:23,name:"⚫ Поставить «чёрную свечу»",desc:"Имя на стене проклятий",token:"DEMON",address:GOD_ADDRESS,amount:1},{id:24,name:"👿 Статус «Богохульник недели»",desc:"Топ грешников с анимацией",token:"DEMON",address:GOD_ADDRESS,amount:100},{id:25,name:"🗑️ Снять чужую икону",desc:"Убрать изображение на 24 часа",token:"DEMON",address:GOD_ADDRESS,amount:50}];let currentAction=null,userWallet=localStorage.getItem('userWallet')||'';function renderActions(){const container=document.getElementById('actionsList');container.innerHTML=actions.map(a=>`<div class="glass p-4"><div class="font-bold text-lg">${a.name}</div><div class="text-sm opacity-80 my-2">${a.desc}</div><div class="text-xs text-gold-light">💰 Цена: ${a.amount} ${a.token}</div><button class="actionBtn mt-3 btn-primary w-full py-1 rounded-full text-sm" data-id="${a.id}">Выбрать</button></div>`).join('');document.querySelectorAll('.actionBtn').forEach(btn=>{btn.onclick=()=>{const id=parseInt(btn.dataset.id);currentAction=actions.find(a=>a.id===id);document.getElementById('modalTitle').innerText=currentAction.name;document.getElementById('modalDesc').innerText=currentAction.desc;document.getElementById('modalAddress').innerText=currentAction.address;document.getElementById('txModal').style.display='flex';document.getElementById('txidInput').value='';document.getElementById('txStatus').innerHTML='';};});}
document.getElementById('confirmBtn').onclick=async()=>{const txid=document.getElementById('txidInput').value.trim();if(!txid){alert('Введите TXID');return;}document.getElementById('txStatus').innerHTML='⏳ Проверяем...';try{const url=`https://public-api.solscan.io/transaction/${txid}`;const resp=await fetch(url);const data=await resp.json();if(!data||!data.txId)throw new Error('Транзакция не найдена');const signer=data.signer?.[0]||data.accountKeys?.[0];if(signer!==userWallet)throw new Error('TXID не с вашего кошелька');let completed=JSON.parse(localStorage.getItem('completedActions')||'[]');completed.push({actionId:currentAction.id,txid,date:new Date().toISOString()});localStorage.setItem('completedActions',JSON.stringify(completed));document.getElementById('txStatus').innerHTML='✅ Дело засчитано!';setTimeout(()=>{document.getElementById('txModal').style.display='none';},1500);}catch(err){document.getElementById('txStatus').innerHTML=`❌ ${err.message}`;}};
document.getElementById('closeModal').onclick=()=>{document.getElementById('txModal').style.display='none';};window.onclick=(e)=>{if(e.target===document.getElementById('txModal'))document.getElementById('txModal').style.display='none';};renderActions();</script></body></html>
